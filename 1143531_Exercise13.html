<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 13</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 40px; background: white; }

    .square {
      width: 80px;
      height: 80px;
      background: pink;
      margin-bottom: 24px;
      transition: width 0.7s ease, height 0.7s ease;
      font-family: "Times New Roman", serif;
      font-size: 20px;
      line-height: 1;
      color: black;
      padding: 2px;
    }

    #square1:hover { width: min(480px, calc(100vw - 80px)); }
    #square2:hover { width: 120px; height: 120px; }
  </style>
</head>
<body>
  <div id="square1" class="square">1</div>
  <div id="square2" class="square">2</div>
</body>
</html>
