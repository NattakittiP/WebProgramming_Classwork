
<!DOCTYPE html>
<html>
<head>
<style>
.box1 {
    background-color: lightblue;
    border: 5px solid tomato;
    padding: 5px;
    margin: 20px;
}

.box2 {
    background-color: yellow;
    border: 3px solid dodgerblue;
    border-radius: 12px;
    padding: 2px;
    margin: 20px;
}

.box3 {
    background-color: mediumseagreen;
    border-top: 10px dotted gray;
    border-bottom: 10px dotted gray;
    padding: 2px;
    margin: 20px;
}
</style>
</head>
<body>

<div class="box1">
    <h1>Hello World</h1>
</div>

<div class="box2">
    <h1>Hello World</h1>
</div>

<div class="box3">
    <h1>Hello World</h1>
</div>

</body>
</html>
